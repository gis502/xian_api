# 数据源配置
spring:
    neo4j:
        uri: bolt://47.92.216.173:7687
        # 必须启用认证（之前被注释了，导致连接可能被拒绝或权限不足）
#        authentication:
#            username: neo4j
#            password: Zzw.0401
        pool:
            metrics-enabled: true
            # 核心：解决待机闲置断连的连接池参数
            max-idle-time: 300000  # 闲置连接5分钟后释放（小于数据库超时）
            max-lifetime: 1800000  # 连接最长存活30分钟（定期换新）
            connection-timeout: 5000  # 连接超时5秒
            # 启用连接校验（从池获取时检查有效性）
            validation-timeout: 2000
        # 驱动级重试配置（应对临时断连）
        driver:
            config:
                retry:
                    attempts: 3  # 失败重试3次
                    delay: 1000  # 重试间隔1秒
                connection:
                    keep-alive: true  # 保持连接活性
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: org.postgresql.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:postgresql://47.92.216.173:7654/xian20250822?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
                username: postgres
                password: zhangsan
#                url: jdbc:postgresql://localhost:5432/xian?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
#                username: postgres
#                password: 123456
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: true
                url: jdbc:postgresql://81.70.200.28:5432/assess_disaster?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
                username: postgres
                password: postgres
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT version()
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true

